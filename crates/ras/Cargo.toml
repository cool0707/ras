[package]
name = "ras"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RAS: a TypeScript-like language that transpiles to VBA"

[[bin]]
name = "ras"
path = "src/main.rs"

[dependencies]
ras-syntax.workspace = true
ras-compiler.workspace = true
ras-ovba.workspace = true
ras-form.workspace = true
ras-lsp.workspace = true
ras-sync.workspace = true
ras-workbook = { path = "../ras-workbook" }
serde_json.workspace = true
clap.workspace = true
encoding_rs.workspace = true
notify.workspace = true

# Embeds the icon (assets/ras.ico) and the version information in ras.exe: see build.rs.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
ras-workbook = { path = "../ras-workbook" }
ras-ovba.workspace = true
ras-form.workspace = true
serde_json.workspace = true
encoding_rs.workspace = true
