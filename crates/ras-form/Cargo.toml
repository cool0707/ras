[package]
name = "ras-form"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UserForm specifications (forms/*.form.json): validation and generation of the MS-OFORMS designer storage (ported from xlflow)"

[dependencies]
ras-ovba = { workspace = true }
# Form code-behinds are RAS: `pull` converts the VBA of a form (`vba2ras`).
ras-compiler = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Decoders for pictures that have to be converted to BMP (see `picture`).
image = { workspace = true }

[dev-dependencies]
cfb = { workspace = true }
# The expected readings (`tests/data/*.expected.json`) are compared number for number.
serde_json = { workspace = true, features = ["float_roundtrip"] }
