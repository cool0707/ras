[package]
name = "ras-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Live sync of generated VBA into a workbook that is open in Excel (spec §14.1-14.8)"

[dependencies]
ras-compiler.workspace = true
ras-ovba.workspace = true
# Taking over the hand-written VBA of the workbook into the project (spec §14.7.1).
ras-form.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
