[package]
name = "ras-ovba"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Offline pack / unpack of the VBA project of Excel workbooks: the package around vbaProject.bin, which umya-spreadsheet's vba module reads and writes"

[dependencies]
