name: Playground

# The playground (web/): the compiler and the stand-in for Excel built to WebAssembly, published
# to GitHub Pages from main. Pull requests and other branches build and test it without publishing.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain version is pinned in rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Use the umya-spreadsheet fork's branch of the same name
        shell: bash
        run: .github/scripts/umya-branch.sh "${{ github.head_ref || github.ref_name }}"
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # wasm-bindgen-cli must be the version of the wasm-bindgen crate in Cargo.lock.
      - name: wasm-bindgen version
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build WebAssembly
        working-directory: web
        run: npm run wasm
      - name: Check types
        working-directory: web
        run: npm run check-types
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
