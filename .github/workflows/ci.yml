name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # The toolchain version is pinned in rust-toolchain.toml (so that clippy is reproducible).
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The scripts that check against the real Excel (tools/, see tools/README.md) need Excel: only parsed here.
      - name: Parse PowerShell scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path tools -Filter *.ps1 -Recurse) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
            Write-Host "parsed $($file.FullName)"
          }
          if ($failed) { exit 1 }
      # Spec §17.3: the workbook written by `ras pack` is checked with an independent parser (oletools).
      - name: Validate packed workbook with olevba
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet oletools
          mkdir "$RUNNER_TEMP/sample" && cd "$RUNNER_TEMP/sample"
          RAS="$GITHUB_WORKSPACE/target/debug/ras"
          "$RAS" init . --workbook Book.xlsm
          "$RAS" form new frmSample
          mkdir -p forms/assets
          cp "$GITHUB_WORKSPACE/crates/ras-form/tests/fixtures/assets/logo.bmp" forms/assets/
          printf '{"schemaVersion":1,"kind":"ras.userform","basis":"designer","form":{"name":"frmSample"},"controls":[{"id":"t","name":"txtSample","type":"TextBox","text":"sample text"},{"id":"c","name":"cboKind","type":"ComboBox","top":24,"list":["first","second"],"selectedIndex":1},{"id":"i","name":"imgLogo","type":"Image","top":48,"picture":{"path":"forms/assets/logo.bmp"}}]}' > forms/frmSample.form.json
          "$RAS" pack
          "$RUNNER_TEMP/venv/bin/olevba" Book.xlsm > olevba.txt
          grep -q "VBA MACRO Main.bas" olevba.txt
          grep -q "VBA MACRO ThisWorkbook.cls" olevba.txt
          grep -q "Public Sub hello()" olevba.txt
          grep -q "VBA MACRO frmSample.frm" olevba.txt
          grep -q "VBA FORM Variable \"b'txtSample'\"" olevba.txt
          grep -q "VBA FORM Variable \"b'imgLogo'\"" olevba.txt
          grep -q "Private Sub RAS_FormInit()" olevba.txt
          grep -q '.AddItem "second"' olevba.txt
          echo "olevba read the generated VBA project:"
          grep "VBA MACRO" olevba.txt
          # The form comes back out of the workbook with its picture.
          mkdir "$RUNNER_TEMP/pulled" && cd "$RUNNER_TEMP/pulled"
          "$RAS" init .
          "$RAS" form pull --book "$RUNNER_TEMP/sample/Book.xlsm"
          cmp forms/assets/frmSample.imgLogo.bmp "$GITHUB_WORKSPACE/crates/ras-form/tests/fixtures/assets/logo.bmp"
          "$RAS" form check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ras.exe
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: ras.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ras
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ras
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p ras --target ${{ matrix.target }}
      # The COM addon of the debug run time (spec §14.10); Windows only.
      - name: Build ras_com addon
        if: startsWith(matrix.name, 'windows-')
        run: cargo build --release --locked -p ras-com --target ${{ matrix.target }}
      # The stand-in for Excel of the debug run time (spec §14.10.8); every platform.
      - name: Build ras_book addon
        run: cargo build --release --locked -p ras-book --target ${{ matrix.target }}
      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp LICENSE README.md dist/
          if [ -f "target/${{ matrix.target }}/release/ras_com.dll" ]; then
            cp "target/${{ matrix.target }}/release/ras_com.dll" dist/ras_com.node
          fi
          for lib in ras_book.dll libras_book.so libras_book.dylib; do
            if [ -f "target/${{ matrix.target }}/release/$lib" ]; then
              cp "target/${{ matrix.target }}/release/$lib" dist/ras_book.node
            fi
          done
          test -f dist/ras_book.node
      # Drives real COM objects (Scripting.Dictionary, WScript.Shell) through the addon.
      - name: Smoke-test ras_com
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          set +e
          node crates/ras-com/tests/smoke.js dist/ras_com.node
          code=$?
          printf 'exit code: %d (0x%X)\n' "$code" "$code"
          exit "$code"
      # Downloadable from the run's summary page ("Artifacts").
      - uses: actions/upload-artifact@v6
        with:
          name: ras-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    # The .vsix ships the ras_com addon for both Windows architectures, and the ras_book addon
    # for every platform.
    needs: build
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ras-windows-x64
          path: ${{ runner.temp }}/windows-x64
      - uses: actions/download-artifact@v7
        with:
          name: ras-windows-arm64
          path: ${{ runner.temp }}/windows-arm64
      - uses: actions/download-artifact@v7
        with:
          name: ras-linux-x64
          path: ${{ runner.temp }}/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: ras-macos-arm64
          path: ${{ runner.temp }}/macos-arm64
      - name: Add the addons
        run: |
          mkdir -p bin/win32-x64 bin/win32-arm64 bin/linux-x64 bin/darwin-arm64
          cp "$RUNNER_TEMP/windows-x64/ras_com.node" "$RUNNER_TEMP/windows-x64/ras_book.node" bin/win32-x64/
          cp "$RUNNER_TEMP/windows-arm64/ras_com.node" "$RUNNER_TEMP/windows-arm64/ras_book.node" bin/win32-arm64/
          cp "$RUNNER_TEMP/linux-x64/ras_book.node" bin/linux-x64/
          cp "$RUNNER_TEMP/macos-arm64/ras_book.node" bin/darwin-arm64/
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: ras-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error
