<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAS フォーム</title>
<link rel="stylesheet" href="frame.css">
<link rel="stylesheet" href="designer/formRunner.css">
<script>
// The VS Code extension's webview in a frame of the playground: what it posts to VS Code goes
// to the page (designer.ts / forms.ts), which answers with postMessage as VS Code does.
(() => {
    let state;
    window.acquireVsCodeApi = () => ({
        postMessage: (message) => parent.postMessage({ rasFrame: message }, "*"),
        getState: () => state,
        setState: (s) => {
            state = s;
        },
    });
})();
</script>
</head>
<body><div id="app"></div><script src="designer/formRunner.js"></script></body>
</html>
